services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Whisper local (gratuito): whisper.cpp transcreve áudio em texto (como o Whisper da OpenAI).
  # Requer o modelo baixado no volume whisper_models — ver README, seção "Como executar".
  # Modelo "base" (141 MB, ~200 MB de RAM). Com RAM sobrando, use "small" (melhor em PT-BR).
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    entrypoint: whisper-server
    command: [ "-m", "/models/ggml-base.bin", "--host", "0.0.0.0", "--port", "8080", "--convert" ]
    ports:
      - "9030:8080"
    volumes:
      - whisper_models:/models

  database:
    image: mysql:9.6
    environment:
      MYSQL_DATABASE: transaction
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - transaction_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  transaction_data:
  whisper_models:
    name: whisper_models
