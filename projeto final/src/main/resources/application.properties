spring.application.name=budgeting

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Ollama (IA local e gratuita — nao precisa de chave de API) ---
spring.ai.ollama.base-url=http://localhost:11434
# Modelo de 1B (1,3 GB): modelos 3B+ sao mortos por falta de RAM em ambientes de ~8 GB.
spring.ai.ollama.chat.options.model=llama3.2:1b
spring.ai.ollama.chat.options.temperature=0
# Contexto menor = menos RAM e avaliacao de prompt mais rapida em CPU fraca
spring.ai.ollama.chat.options.num-ctx=2048
# Baixa o modelo automaticamente na primeira execucao, se estiver ausente
spring.ai.ollama.init.pull-model-strategy=WHEN_MISSING

# --- Whisper local (transcricao de audio gratuita, via Docker) ---
app.whisper.base-url=http://localhost:9030

# Timeouts do cliente HTTP da IA: inferencia em CPU pode levar minutos
spring.ai.http.client.connect-timeout=30s
spring.ai.http.client.read-timeout=10m
# Poucas tentativas: com o padrao (10) um erro do Ollama parece travamento de varios minutos
spring.ai.retry.max-attempts=2

logging.level.org.springframework.ai=DEBUG
