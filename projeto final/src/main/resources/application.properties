spring.application.name=budgeting

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Ollama (IA local e gratuita — nao precisa de chave de API) ---
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0
# Baixa o modelo automaticamente na primeira execucao, se estiver ausente
spring.ai.ollama.init.pull-model-strategy=WHEN_MISSING

logging.level.org.springframework.ai=DEBUG
