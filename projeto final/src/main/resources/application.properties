spring.application.name=budgeting

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Ollama (IA local e gratuita — nao precisa de chave de API) ---
spring.ai.ollama.base-url=http://localhost:11434
# Modelo leve (~1 GB) — cabe na memoria de ambientes pequenos e
# segue instrucoes/tool calling com mais precisao que o llama3.2:1b.
# Com mais RAM disponivel, experimente llama3.2 (3B) ou qwen2.5:3b.
spring.ai.ollama.chat.options.model=qwen2.5:1.5b
spring.ai.ollama.chat.options.temperature=0
# Baixa o modelo automaticamente na primeira execucao, se estiver ausente
spring.ai.ollama.init.pull-model-strategy=WHEN_MISSING

# --- Whisper local (transcricao de audio gratuita, via Docker) ---
app.whisper.base-url=http://localhost:9030

logging.level.org.springframework.ai=DEBUG
